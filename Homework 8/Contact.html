<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="main_style.css">




</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5" style="background-image: url(navbar_background.jpg);">
        <div class="container">
            <a class="navbar-brand" style="font-style: oblique; color: rgb(222, 255, 211);">Deema's World</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html" style="color:rgb(222, 255, 211) ;">Homepage</a>
                <a class="nav-link" href="Story.html" style="color:rgb(222, 255, 211) ;">Story</a>
                <a class="nav-link" href="Contact.html" style="color:rgb(222, 255, 211) ;">Contact us</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h2 class="card-title text-center mb-4">Contact Us</h2>
                        
                        <form action="#" method="POST">
                            
                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-bold">Name</label>
                                <input type="text" class="form-control" id="fullName" name="fullName" placeholder="Enter your name" required>
                            </div>

                            <div class="mb-4">
                                <label for="emailAddress" class="form-label fw-bold">Email address</label>
                                <input type="email" class="form-control" id="emailAddress" name="emailAddress" placeholder="name@example.com" required>
                            </div>
                            <a href="#" target="_blank" >terms of agreement</a>
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="termsAgreement" name="termsAgreement" required>
                                <label class="form-check-label" for="termsAgreement">
                                    I accept the terms of agreement 
                                </label>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-dark btn-lg" onclick="field_sensor()">Submit</button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
const name=document.getElementById("fullName");
const email=document.getElementById("emailAddress")
const submit = document.getElementById("submit");

function field_sensor(){
    if (name.value.trim() === "") {
        name.style.backgroundColor ="#ff8f8f";
    }
    if (email.value.trim() === "") {
        email.style.backgroundColor ="#ff8f8f";
    }
;
}
</script>
</body>
</html>
